repos:
-   repo: local
    hooks:
    -   id: format-code
        name: Format Code
        entry: scripts/format_code.sh
        args: ["--hook"]
        language: script
        files: \.(cc|h|proto|rs|java|py|bp|bazel)$|BUILD$|Cargo\.toml$
        # The regex above covers:
        # .cc, .h, .proto (C/C++/Proto)
        # .rs (Rust)
        # .java (Java)
        # .py (Python)
        # .bp (Android.bp)
        # Files ending in .bazel (e.g., MODULE.bazel)
        # BUILD
