[package]
name = "netsim-verify"
version = "0.1.0"
edition = "2024"

[lib]
name = "features"
path = "src/lib.rs"

[dependencies]
gherkin = "0.14"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termcolor = "1.4"

[dev-dependencies]
bytes = "1.0"
futures = "0.3"
packets = { package = "netsim-packets", path = "../../packets" }
tokio = { version = "1.41.1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
verify-macros = { path = "../macros" }
