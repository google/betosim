[package]
name = "link-actor"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
futures = "0.3"
link-api = { path = "../link-api" }
netsim-model = { path = "../model" }
tracing = "0.1"

[dev-dependencies]
actor-framework = { path = "../actor-framework", features = ["testing"] }
link-actor = { path = ".", features = ["testing"] }
link-api = { path = "../link-api", features = ["testing"] }
netsim-model = { path = "../model", features = ["testing"] }
tokio = { version = "1", features = ["full"] }

[features]
testing = [
  "actor-framework/testing",
  "link-api/testing",
  "netsim-model/testing",
]
