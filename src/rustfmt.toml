# Derived from Android Format Style
#
# Any changes here _must not_ conflict with the upstream in
# build/soong/scripts/rustfmt.toml

edition = "2024"
use_small_heuristics = "Max"
newline_style = "Unix"

# Import organization
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Comment formatting
# TODO(b/564593681): Re-enable when rustfmt comment wrapping is ready and stable across toolchains.
# wrap_comments = true
format_code_in_doc_comments = true
