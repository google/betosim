[package]
name = "bluetooth-actor"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[lib]
name = "bluetooth_actor"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1.68"
bytes = "1.4.0"
device-actor = { path = "../device-actor" }
futures = "0.3.31"
hex = "0.4.3"
netsim-model = { path = "../model" }
netsim-packets = { path = "../packets" }
netsim-proto = { path = "../../proto/proto-cf" }
parking_lot = "0.12"
rootcanal = { path = "../rootcanal" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.32.0", default-features = false, features = [
  "rt",
  "time",
  "sync",
  "macros",
] }
tokio-stream = "0.1.17"
tracing = "0.1"
zerocopy = "0.8.25"

[features]
default = []
test-utils = []

[dev-dependencies]
common = { package = "netsim-common", path = "../common" }
netsim-model = { path = "../model", features = ["testing"] }
netsim-testing = { path = "../testing", features = ["testing"] }
rand = "0.8.5"
tracing-subscriber = "0.3"
