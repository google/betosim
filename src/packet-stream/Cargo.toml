[package]
name = "packet-stream"
version = "0.1.0"
edition = "2024"
description = "Simplified cross-platform packet streaming framework - core library"
repository = "https://github.com/schilit/packetstream"
license = "MIT"
keywords = ["ipc", "networking", "packets", "cross-platform", "performance"]
categories = ["network-programming", "api-bindings"]
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
async-trait = "0.1"
bytes = "1.0"
command-fds = { version = "0.3", optional = true }
futures = "0.3"
netsim-types = { path = "../types" }
nix = { version = "0.31", features = ["fs", "socket"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[features]
cuttlefish = ["dep:command-fds"]

[dev-dependencies]
tokio-test = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"
