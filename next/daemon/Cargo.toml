[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "daemon"
path = "src/lib.rs"

[[bin]]
name = "netsimd"
path = "src/main.rs"

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
ap-actor = { path = "../ap-actor" }
bluetooth-actor = { path = "../bluetooth-actor" }
bytes = "1"
capture-actor = { path = "../capture-actor" }
cell-actor = { path = "../cell-actor" }
clap = { version = "4.1.8", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
  "env",
] }
command-fds = { version = "0.3", optional = true }
common = { package = "netsim-common", path = "../common" }
device-actor = { path = "../device-actor" }
device-api = { path = "../device-api" }
ethernet-actor = { package = "ethernet_actor", path = "../ethernet-actor" }
futures = "0.3"
grpc-server = { path = "../grpc-server" }
grpcio = { version = "0.13", default-features = false, features = [
  "protobufv3-codec",
  "boringssl",
] }
hci-server = { path = "../hci-server" }
link-actor = { path = "../link-actor" }
link-api = { path = "../link-api" }
netsim-model = { path = "../model" }
netsim-rest-api = { path = "../rest-api" }
nfc-actor = { path = "../nfc-actor" }
packet-stream = { path = "../packet-stream" }
rootcanal-server = { path = "../rootcanal-server", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slirp-actor = { path = "../slirp-actor" }
tokio = { version = "1.28.2", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tracing = "0.1"
uwb-actor = { path = "../uwb-actor" }
websocket-server = { path = "../websocket-server" }
wifi-actor = { path = "../wifi-actor" }

[dev-dependencies]
daemon = { path = ".", features = ["testing"] }
netsim-proto = { path = "../../proto/proto-cf" }
rand = "0.8"
regex = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[features]
default = []
cuttlefish = [
  "common/cuttlefish",
  "dep:command-fds",
  "dep:rootcanal-server",
  "dep:tokio-util",
  "ethernet-actor/cuttlefish",
  "nfc-actor/cuttlefish",
  "packet-stream/cuttlefish",
  "slirp-actor/cuttlefish",
  "uwb-actor/cuttlefish",
]
testing = []
