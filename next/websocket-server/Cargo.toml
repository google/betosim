[package]
name = "websocket-server"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1.4"
device-actor = { path = "../device-actor" }
device-api = { path = "../device-api" }
form_urlencoded = "1.2"
futures = "0.3.30"
http = "0.2"
httparse = "1.9"
netsim-model = { path = "../model" }
ring = "0.17.2"
thiserror = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tungstenite = { version = ">=0.19.0", default-features = false }

[dev-dependencies]
actor-framework = { path = "../actor-framework", features = ["testing"] }
common = { package = "netsim-common", path = "../common" }
mockall = "0.14.0"
websocket-server = { path = ".", features = ["testing"] }

[features]
testing = ["device-actor/testing", "device-api/testing", "netsim-model/testing"]
