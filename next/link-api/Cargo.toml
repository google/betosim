[package]
name = "link-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
mockall = { version = "0.14.0", optional = true }
netsim-model = { path = "../model" }
thiserror = "1.0"

[dev-dependencies]
link-api = { path = ".", features = ["testing"] }
mockall = "0.14.0"

[features]
testing = ["actor-framework/testing", "dep:mockall", "netsim-model/testing"]
