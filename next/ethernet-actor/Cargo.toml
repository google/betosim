[package]
name = "ethernet_actor"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "ethernet_actor"
path = "src/lib.rs"

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
device-actor = { path = "../device-actor" }
netsim-model = { path = "../model" }
slirp-actor = { path = "../slirp-actor" }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
actor-framework = { path = "../actor-framework", features = ["testing"] }
bytes = "1.0"
device-api = { path = "../device-api", features = ["testing"] }
ethernet_actor = { path = ".", features = ["testing"] }
futures = "0.3"

[features]
cuttlefish = []
testing = [
  "actor-framework/testing",
  "device-actor/testing",
  "netsim-model/testing",
  "slirp-actor/testing",
]
