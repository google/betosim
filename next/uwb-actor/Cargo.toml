[package]
name = "uwb-actor"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[features]
cuttlefish = []
testing = [
  "actor-framework/testing",
  "device-actor/testing",
  "netsim-model/testing",
]

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
bytes = "1"
device-actor = { path = "../device-actor" }
futures = "0.3"
glam = "0.25"
netsim-model = { path = "../model" }
netsim-proto = { path = "../../proto/proto-cf" }
parking_lot = "0.12"
pdl-runtime = "0.5"
pica = { version = "0.2", default-features = false }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
device-api = { path = "../device-api", features = ["testing"] }
netsim-testing = { path = "../testing", features = ["testing"] }
uwb-actor = { path = ".", features = ["testing"] }
