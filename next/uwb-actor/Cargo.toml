[package]
name = "uwb-actor"
version = "0.1.0"
edition = "2024"

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
bytes = "1"
device-actor = { path = "../device-actor" }
futures = "0.3"
glam = "0.25"
netsim-model = { path = "../model" }
netsim-proto = { path = "../../rust/proto-cf" }
pica = { version = "0.1", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
device-api = { path = "../device-api" }
netsim-testing = { path = "../testing", features = ["testing"] }
