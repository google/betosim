[package]
name = "grpc-server"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1.0"
cell-actor = { path = "../cell-actor" }
device-actor = { path = "../device-actor" }
device-api = { path = "../device-api" }
futures = "0.3"
grpcio = { version = "0.13", default-features = false, features = [
  "protobufv3-codec",
  "openssl",
] }
link-actor = { path = "../link-actor" }
link-api = { path = "../link-api" }
nfc-actor = { path = "../nfc-actor" }
wifi-actor = { path = "../wifi-actor" }

actor-framework = { path = "../actor-framework" }
capture-actor = { path = "../capture-actor" }
netsim-model = { path = "../model" }
packet-stream = { path = "../packet-stream" }
protobuf = "3"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
capture-api = { path = "../capture-api" }
tempfile = "3"
