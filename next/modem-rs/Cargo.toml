[package]
name = "modem-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[lib]
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
bytes = "1"
hex = "0.4.3"
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }
modem-rs-derive = { path = "../modem-rs-derive" }
netsim-model = { path = "../model" }
nom = "7"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6.0"
tokio = { version = "1.28.2", features = ["full", "tracing"] }
tracing = "0.1"

[dev-dependencies]
modem-rs = { path = ".", features = ["test-utils"] }
serde_json = "1.0"
tracing-subscriber = "0.3.23"
once_cell = "1.19"
tempfile = "3"

[features]
test-utils = []
testing = []
