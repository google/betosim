[package]
name = "netsim-cli"
version = "0.3.92"
edition = "2024"

[[bin]]
name = "netsim"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.1.8", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
futures = "0.3.30"
futures-util = { version = "0.3.30", default-features = false, features = [
  "sink",
] }
grpcio = { version = "0.13.0", default-features = false, features = [
  "protobufv3-codec",
  "boringssl",
] }
hex = "0.4.3"
httparse = "1.9"
netsim-common = { path = "../common" }
netsim-model = { path = "../model" }
netsim-packets = { path = "../packets" }
netsim-proto = { path = "../../proto/proto-cf" }
netsim-rest-api = { path = "../rest-api" }
protobuf = "3.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tungstenite = { version = ">=0.19.0", default-features = false }
