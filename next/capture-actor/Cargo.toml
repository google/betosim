[package]
name = "capture-actor"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/mod.rs"

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
byteorder = "1.4"
bytes = "1.5"
capture-api = { path = "../capture-api" }
common = { package = "netsim-common", path = "../common" }
futures = "0.3"
netsim-model = { path = "../model" }
netsim-packets = { path = "../packets" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }

[features]
testing = ["actor-framework/testing"]
