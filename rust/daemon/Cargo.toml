[package]
name = "netsim-daemon"
version = "0.3.119"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
bytes = { version = ">=1.4.0" }
clap = { version = "4.1.8", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
  "env",
] }
cxx = { version = ">=1.0.85", features = ["c++17"] }
data-encoding = "2.4.0"
futures = "0.3.30"
glam = { version = "0.25.0", features = ["libm"] }
hostapd-rs = { path = "../hostapd-rs" }
http = "0.2.9"
http-proxy = { path = "../http-proxy" }
httparse = "1.9.5"
libslirp-rs = { path = "../libslirp-rs" }
netsim-common = { path = "../common" }
netsim-packets = { path = "../packets" }
# Relax the version constraint for 'pica' to allow cargo to select a compatible version
# from crates.io since 0.1.9 seems to be only available in AOSP.
anyhow = "1"
futures-channel = { version = "0.3.30", features = ["sink"] }
futures-executor = "0.3.30"
futures-util = { version = "0.3.30", default-features = false, features = [
  "sink",
] }
grpcio = { version = "0.13.0", default-features = false, features = [
  "protobufv3-codec",
] }
log = "0.4.17"
pdl-runtime = "0.4.2"
pica = { version = "0.1", default-features = false }
protobuf = "3.2.0"
protobuf-json-mapping = "3.2.0"
rand = "0.8.5"
regex = "1.6.0"
socket2 = "0.5.5"
thiserror = { version = ">=1.0.40" }
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
tungstenite = { version = ">=0.19.0", default-features = false }

[build-dependencies]
cxx-build = "1.0.92"

[features]
local_ssl = []
default = ["local_ssl"]
cuttlefish = []
