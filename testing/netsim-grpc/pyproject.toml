[build-system]
# AVOID CHANGING REQUIRES: IT WILL BE UPDATED BY PYSCAFFOLD!
requires = ["setuptools>=46.1.0", "wheel", "grpcio-tools"]
build-backend = "setuptools.build_meta"

# [tool.setuptools_scm]
# # For smarter version schemes and other configuration options,
# # check out https://github.com/pypa/setuptools_scm
# version_scheme = "no-guess-dev"
[project]
name = "netsim-grpc"
authors = [
    { name = "Erwin Jansen", email = "jansene@google.com" },
    { name = "Shuo Wang Hsu", email = "shuohsu@google.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
version = "0.0.1"
classifiers = ["Topic :: Software Development"]
dependencies = [
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "importlib-metadata; python_version<'3.8'",
]

[project.optional-dependencies]
tests = ["pytest==9.0.3", "pytest-mock", "mock==4.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
tests = ["pytest==9.0.3", "pytest_mock==3.8.2"]
